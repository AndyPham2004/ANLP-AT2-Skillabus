[theme]
# Poster palette: navy ink, UTS blue for skills you have, copper for gaps.
base = "light"
primaryColor = "#1f4e8c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#0b1a2e"
font = "sans serif"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
